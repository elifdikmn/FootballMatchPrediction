name: Sync live scores
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/sync-live.yml
      - live_sync.py
      - live_repository.py
      - provider_cache.py
      - models.py
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
concurrency:
  group: live-scores
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install sqlalchemy psycopg[binary] python-dotenv requests
      - name: Validate required configuration
        shell: bash
        run: |
          if [[ -z "$DATABASE_URL" || -z "$API_FOOTBALL_KEY" ]]; then
            echo "DATABASE_URL and API_FOOTBALL_KEY repository secrets are required."
            exit 1
          fi
      - name: Refresh shared scores only during fixture windows
        run: python live_sync.py
